<svg width="920" height="280" viewBox="0 0 920 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAB308"/>
      <stop offset="50%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EAB308" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>
  <rect width="920" height="280" rx="12" fill="#0A0A0A" stroke="#27272A" stroke-width="1"/>
  <!-- Title -->
  <text x="48" y="72" font-family="ui-sans-serif, system-ui, sans-serif" font-size="48" font-weight="800" letter-spacing="-0.03em">
    <tspan fill="white">VISU</tspan><tspan fill="#EAB308">RA</tspan>
  </text>
  <line x1="48" y1="82" x2="198" y2="82" stroke="#EAB308" stroke-width="3" stroke-linecap="round"/>
  <!-- Tagline -->
  <text x="48" y="118" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="500" fill="#A1A1AA" letter-spacing="0.01em">AI-powered document intelligence for PDFs and pipeline insights.</text>
  <text x="48" y="148" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="400" fill="#71717A" letter-spacing="0.01em">One platform. Smart summaries. Chat with your documents.</text>

  <!-- Documents falling (rainfall) - full width from start to end of SVG -->
  <g fill="#27272A" stroke="#3F3F46" stroke-width="0.5" opacity="0.6">
    <g><rect x="60" y="-30" width="9" height="12" rx="1"/><animateTransform attributeName="transform" type="translate" values="0 0; 8 320" dur="5.5s" repeatCount="indefinite" begin="0s"/></g>
    <g><rect x="140" y="-20" width="10" height="14" rx="1"/><animateTransform attributeName="transform" type="translate" values="0 0; -6 310" dur="6s" repeatCount="indefinite" begin="0.5s"/></g>
    <g><rect x="220" y="-25" width="8" height="11" rx="1"/><animateTransform attributeName="transform" type="translate" values="0 0; 10 325" dur="5.2s" repeatCount="indefinite" begin="1s"/></g>
    <g><rect x="300" y="-18" width="11" height="15" rx="1"/><animateTransform attributeName="transform" type="translate" values="0 0; -8 318" dur="5.8s" repeatCount="indefinite" begin="1.8s"/></g>
    <g><rect x="380" y="-22" width="9" height="13" rx="1"/><animateTransform attributeName="transform" type="translate" values="0 0; 5 322" dur="6.2s" repeatCount="indefinite" begin="0.3s"/></g>
    <g><rect x="460" y="-28" width="10" height="12" rx="1"/><animateTransform attributeName="transform" type="translate" values="0 0; -12 328" dur="5.4s" repeatCount="indefinite" begin="2.2s"/></g>
    <g><rect x="540" y="-15" width="8" height="11" rx="1"/><animateTransform attributeName="transform" type="translate" values="0 0; 7 315" dur="5.6s" repeatCount="indefinite" begin="1.2s"/></g>
    <g><rect x="620" y="-26" width="9" height="14" rx="1"/><animateTransform attributeName="transform" type="translate" values="0 0; -9 326" dur="5.9s" repeatCount="indefinite" begin="2.5s"/></g>
    <g><rect x="700" y="-19" width="10" height="13" rx="1"/><animateTransform attributeName="transform" type="translate" values="0 0; 6 319" dur="5.3s" repeatCount="indefinite" begin="0.7s"/></g>
    <g><rect x="780" y="-24" width="8" height="12" rx="1"/><animateTransform attributeName="transform" type="translate" values="0 0; -11 324" dur="6.1s" repeatCount="indefinite" begin="1.5s"/></g>
    <g><rect x="860" y="-21" width="9" height="11" rx="1"/><animateTransform attributeName="transform" type="translate" values="0 0; 9 321" dur="5.7s" repeatCount="indefinite" begin="2.8s"/></g>
    <g><rect x="110" y="-27" width="10" height="12" rx="1"/><animateTransform attributeName="transform" type="translate" values="0 0; -7 327" dur="5.4s" repeatCount="indefinite" begin="3s"/></g>
    <g><rect x="260" y="-23" width="9" height="13" rx="1"/><animateTransform attributeName="transform" type="translate" values="0 0; 11 323" dur="6s" repeatCount="indefinite" begin="0.2s"/></g>
    <g><rect x="420" y="-29" width="8" height="11" rx="1"/><animateTransform attributeName="transform" type="translate" values="0 0; -10 329" dur="5.8s" repeatCount="indefinite" begin="1.8s"/></g>
    <g><rect x="580" y="-16" width="11" height="14" rx="1"/><animateTransform attributeName="transform" type="translate" values="0 0; 8 316" dur="5.5s" repeatCount="indefinite" begin="2.3s"/></g>
    <g><rect x="740" y="-31" width="9" height="12" rx="1"/><animateTransform attributeName="transform" type="translate" values="0 0; -5 331" dur="6.3s" repeatCount="indefinite" begin="0.9s"/></g>
  </g>

  <!-- Diagram: chart with line draw-in animation -->
  <g transform="translate(480, 40)">
    <line x1="0" y1="180" x2="420" y2="180" stroke="#27272A" stroke-width="1"/>
    <line x1="0" y1="120" x2="420" y2="120" stroke="#27272A" stroke-width="1"/>
    <line x1="0" y1="60" x2="420" y2="60" stroke="#27272A" stroke-width="1"/>
    <!-- Trend line: draws upward -->
    <path id="trendPath" d="M 0 170 L 100 150 L 200 125 L 300 95 L 400 55 L 420 40" stroke="url(#line)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="550" stroke-dashoffset="550">
      <animate attributeName="stroke-dashoffset" from="550" to="0" dur="1.4s" fill="freeze"/>
    </path>
    <!-- Data points: appear after line -->
    <circle cx="0" cy="170" r="4" fill="#EAB308" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="0.3s" fill="freeze"/>
    </circle>
    <circle cx="200" cy="125" r="5" fill="#EAB308" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="0.8s" fill="freeze"/>
    </circle>
    <circle cx="400" cy="55" r="4" fill="#1C1917" stroke="#EAB308" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="1.4s" fill="freeze"/>
    </circle>
    <text x="185" y="155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" fill="#EAB308" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.75s" fill="freeze"/>
    </text>
  </g>

  <rect x="0" y="260" width="920" height="20" fill="url(#bar)"/>
</svg>
